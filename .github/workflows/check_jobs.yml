name: Check Sarkari Result Jobs

on:
  schedule:
    # Runs at minute 0 past every hour (24 times a day)
    - cron: '30 4,14 * * *'
  # Allows manual 1-click test runs from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper & Notify Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_BOT_TOKEN || secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scraper.py

      - name: Commit and Push Updated History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_jobs.json
          # Only commit if sent_jobs.json was actually modified
          if ! git diff --cached --quiet; then
            git commit -m "chore: update sent jobs [skip ci]"
            git push
          else
            echo "No changes in sent_jobs.json to commit."
          fi
